name: Deploy Backend to ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: 884375106358
  ECR_REPOSITORY: hokushi-backend
  ECS_CLUSTER: default
  ECS_SERVICE: hokushi-backend-064b
  BACKEND_DIR: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push (linux/amd64)
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eux

          IMAGE_SHA_URI=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          IMAGE_LATEST_URI=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

          docker buildx build \
            --platform linux/amd64 \
            -t ${IMAGE_SHA_URI} \
            -t ${IMAGE_LATEST_URI} \
            --push \
            .

      - name: Force new deployment on ECS
        run: |
          set -eux
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment

      # Express/Canary だと 10分超えることがあるので、待機上限を伸ばす
      - name: Wait for service stability (up to 20 min)
        run: |
          set -eux
          for i in $(seq 1 80); do
            is_stable=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "${{ env.ECS_SERVICE }}" \
              --query "services[0].length(deployments) == \`1\` && services[0].runningCount == services[0].desiredCount && services[0].pendingCount == \`0\`" \
              --output text)

            if [ "$is_stable" = "True" ]; then
              echo "Service is stable."
              exit 0
            fi

            echo "Service not stable yet (attempt ${i}/80)."
            sleep 15
          done

          echo "Timed out waiting for service stability."
          exit 1

      # 失敗したときだけ、原因が分かるように events を表示
      - name: Debug ECS events on failure
        if: failure()
        run: |
          echo "==== ECS Service Events (latest 20) ===="
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query "services[0].events[0:20].[createdAt,message]" \
            --output table
